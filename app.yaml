name: ivay-caller-portal
memory_mb: 896
port: 3000
domains:
  - caller.ivay.tech
database: true
env:
  AUTH_SECRET:
    generate: hex
  # Points at the self-managed Asterisk container running on the same
  # hostinger-vps node (see docker/asterisk/ -- zorc can't host Asterisk
  # itself, it needs raw SIP/RTP UDP exposure zorc's Traefik-only ingress
  # doesn't allow). Set via deploy()'s env_overrides, not zorc-generated.
  AMI_HOST:
    required: true
  AMI_PORT:
    required: true
  AMI_USER:
    required: true
  AMI_PASS:
    required: true
