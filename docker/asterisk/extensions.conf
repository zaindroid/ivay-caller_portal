; Dev-only placeholder dialplan — enough for a local Originate to resolve to
; something rather than "no such context/extension". Real dialplan (PSTN
; trunk, bot-answer extension, agent transfer queue) is configured on the
; production VPS, same as the prototype's dialer/index.js expects.
[from-dialer]
exten => ivay-bot,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

[from-internal]
exten => 9000,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()
